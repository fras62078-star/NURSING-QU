<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار تمريض نفسي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap');
:root{--paper:#F6F4EE;--ink:#16302E;--teal:#1F4B48;--teal-deep:#0F2E2C;--line:#C9C2AD;--amber:#B5762A;--wrong:#9C3B2E;--good:#2E6B4F;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:32px 16px 60px;}
.chart{width:100%;max-width:640px;}
.chart-header{background:var(--teal-deep);color:var(--paper);padding:18px 24px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--amber);}
.chart-header h1{font-size:19px;font-weight:800;}
.chart-header .meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#CFEAE3;direction:ltr;}
.chart-body{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;}
.vitals{height:38px;border-bottom:1px dashed var(--line);position:relative;overflow:hidden;}
.vitals svg{width:100%;height:100%;display:block;}
.vitals .count{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal);background:#fff;padding:2px 8px;direction:ltr;}
.q-area{padding:28px 26px 8px;}
.q-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);direction:ltr;margin-bottom:10px;}
.q-text{font-size:19px;font-weight:700;line-height:1.6;color:var(--ink);margin-bottom:22px;}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.opt{border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;font-size:15.5px;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fff;transition:border-color .15s,background .15s;text-align:right;}
.opt:hover{border-color:var(--teal);}
.opt .bullet{width:24px;height:24px;min-width:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal);}
.opt.selected{border-color:var(--teal);background:#EFF4F1;}
.opt.correct{border-color:var(--good);background:#EAF4EC;}
.opt.correct .bullet{background:var(--good);color:#fff;border-color:var(--good);}
.opt.wrong{border-color:var(--wrong);background:#FBECEA;}
.opt.wrong .bullet{background:var(--wrong);color:#fff;border-color:var(--wrong);}
.opt.disabled{cursor:default;}
.feedback{font-size:14px;padding:12px 14px;border-radius:8px;margin-bottom:18px;display:none;line-height:1.7;}
.feedback.show{display:block;}
.feedback.good{background:#EAF4EC;color:var(--good);border:1px solid #cfe6d6;}
.feedback.bad{background:#FBECEA;color:var(--wrong);border:1px solid #f0d0cb;}
.controls{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:16px 26px;}
.score{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal);direction:ltr;}
button.next{background:var(--teal);color:#fff;border:none;padding:11px 26px;border-radius:7px;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;}
button.next:disabled{background:#B9C6C1;cursor:not-allowed;}
button.next:hover:not(:disabled){background:var(--teal-deep);}
.result{text-align:center;padding:50px 26px;}
.result .big{font-size:44px;font-weight:800;color:var(--teal);font-family:'IBM Plex Mono',monospace;}
.result p{margin-top:10px;color:#5b5b52;font-size:15px;}
.restart{margin-top:24px;background:var(--amber);color:#fff;border:none;padding:11px 26px;border-radius:7px;font-family:'Tajawal',sans-serif;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="chart">
  <div class="chart-header">
    <h1 id="examTitle">اختبار تمريض نفسي</h1>
    <div class="meta">RN · PSYCH-01</div>
  </div>
  <div class="chart-body">
    <div class="vitals">
      <svg id="vitalsSvg" viewBox="0 0 600 38" preserveAspectRatio="none"></svg>
      <div class="count" id="progressCount">1 / 3</div>
    </div>
    <div id="quizView">
      <div class="q-area">
        <div class="q-tag" id="qTag">Q01</div>
        <div class="q-text" id="qText"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
      </div>
      <div class="controls">
        <div class="score" id="scoreLine">SCORE: 0/0</div>
        <button class="next" id="nextBtn" disabled>التالي</button>
      </div>
    </div>
    <div id="resultView" style="display:none" class="result">
      <div class="big" id="finalScore"></div>
      <p id="finalMsg"></p>
      <button class="restart" id="restartBtn">إعادة الاختبار</button>
    </div>
  </div>
</div>
<script>
const EXAM_TITLE = "اختبار تمريض نفسي";
const questions = [
  {
    q: "When managing a client with acute mania who attempts to invade others' personal space, enter the nurses' station, and stretch environmental boundaries, what is the most appropriate nursing action?",
    options: [
      "Argue loudly with the client to establish absolute staff dominance.",
      "Set clear, firm, and consistent limits on inappropriate behaviors in a calm, slow manner without arguing.",
      "Allow the client unmonitored access to all areas of the unit to satisfy their high energy needs.",
      "Ignore the behavior completely and enforce no rules whatsoever during the manic phase."
    ],
    correct: 1,
    note: "Manic clients often try to control their environment and invade personal space due to grandiosity. Nurses must set firm limits on inappropriate behavior while maintaining a calm, non-argumentative approach."
  },
  {
    q: "Which of the following represents the estimated concordance rate for Major Depressive Disorder among mono-zygotic (identical) twins according to the genetic studies in the notes?",
    options: ["5% to 12%", "12%", "45% to 60%", "75% to 90%"],
    correct: 2,
    note: "Family, adoption, and twin studies show that the average concordance rate for major depressive disorder among monozygotic twins is 45%–60%, compared to 12% for dizygotic twins."
  },
  {
    q: "What is the primary diagnostic distinction between Bipolar I Disorder and Bipolar II Disorder?",
    options: [
      "Bipolar I involves at least one full manic episode, whereas Bipolar II involves at least one hypomanic episode and at least one major depressive episode (with no history of full mania).",
      "Bipolar II is more severe and features a higher rate of psychotic features than Bipolar I.",
      "Bipolar I never involves depressive episodes, whereas Bipolar II consists only of depression.",
      "Bipolar II requires lifelong continuous hospitalization."
    ],
    correct: 0,
    note: ""
  }
];

let current = 0, score = 0, answered = false;
const qText = document.getElementById('qText');
const qTag = document.getElementById('qTag');
const optionsDiv = document.getElementById('options');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const scoreLine = document.getElementById('scoreLine');
const progressCount = document.getElementById('progressCount');
const vitalsSvg = document.getElementById('vitalsSvg');
const quizView = document.getElementById('quizView');
const resultView = document.getElementById('resultView');
document.getElementById('examTitle').textContent = EXAM_TITLE;

function drawVitals(progressRatio){
  const w = 600, h = 38;
  let path = `M0 ${h/2}`;
  const segments = 12;
  for(let i=0;i<segments;i++){
    const x = (w/segments)*i;
    const active = (x/w) < progressRatio;
    const amp = active ? 14 : 4;
    path += ` L${x+10} ${h/2-amp} L${x+16} ${h/2+amp*0.6} L${x+22} ${h/2}`;
  }
  path += ` L${w} ${h/2}`;
  vitalsSvg.innerHTML = `<path d="${path}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
}

function loadQuestion(){
  answered = false;
  const item = questions[current];
  qTag.textContent = 'Q' + String(current+1).padStart(2,'0');
  qText.textContent = item.q;
  optionsDiv.innerHTML = '';
  feedback.className = 'feedback';
  feedback.textContent = '';
  nextBtn.disabled = true;
  nextBtn.textContent = current === questions.length - 1 ? 'إنهاء الاختبار' : 'التالي';
  const letters = ['A','B','C','D'];
  item.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="bullet">${letters[idx]}</span><span>${opt}</span>`;
    div.addEventListener('click', () => selectOption(idx, div));
    optionsDiv.appendChild(div);
  });
  progressCount.textContent = `${current+1} / ${questions.length}`;
  drawVitals(current/questions.length);
  scoreLine.textContent = `SCORE: ${score}/${current}`;
}

function selectOption(idx, el){
  if(answered) return;
  answered = true;
  const item = questions[current];
  const allOpts = optionsDiv.querySelectorAll('.opt');
  allOpts.forEach(o => o.classList.add('disabled'));
  if(idx === item.correct){
    el.classList.add('correct');
    score++;
    feedback.className = 'feedback show good';
    feedback.textContent = '✓ Correct' + (item.note ? ' — ' + item.note : '');
  } else {
    el.classList.add('wrong');
    allOpts[item.correct].classList.add('correct');
    feedback.className = 'feedback show bad';
    feedback.textContent = '✗ Incorrect' + (item.note ? ' — ' + item.note : '');
  }
  scoreLine.textContent = `SCORE: ${score}/${current+1}`;
  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', () => {
  if(current < questions.length - 1){
    current++;
    loadQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  quizView.style.display = 'none';
  resultView.style.display = 'block';
  document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
  const pct = Math.round((score/questions.length)*100);
  let msg = '';
  if(pct >= 80) msg = 'أداء ممتاز — استمر بهذا المستوى.';
  else if(pct >= 60) msg = 'أداء جيد، راجع الأخطاء لتثبيت المعلومة.';
  else msg = 'يُنصح بمراجعة المفاهيم الأساسية قبل المحاولة التالية.';
  document.getElementById('finalMsg').textContent = `نسبة الإجابات الصحيحة: ${pct}% — ${msg}`;
  drawVitals(1);
}

document.getElementById('restartBtn').addEventListener('click', () => {
  current = 0; score = 0;
  quizView.style.display = 'block';
  resultView.style.display = 'none';
  loadQuestion();
});

loadQuestion();
</script>
</body>
</html>
